name: Bug (from the app)
description: A problem in IfcSheet. The Feedback button in the app opens this form with the fields filled in.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This repository is public. Do not paste confidential model data, client names or file names you would not want read by anyone.
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: App version, browser and where you were, if you chose to attach them in the app.
    validations:
      required: false

name: Feature request
description: Tell us about a drawing or a job you could not do with IfcSheet.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you could not do
      description: The drawing you needed to make, or the job you were trying to finish, and where IfcSheet stopped you.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help (optional)
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today (optional)
    validations:
      required: false

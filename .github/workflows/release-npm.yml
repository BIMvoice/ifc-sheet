# Publishes @bimvoice/ifcsheet to npm. It cannot run by accident:
#   - only a manual workflow_dispatch starts it (no push, schedule or PR trigger);
#   - the input `confirm` must be the word `publish`;
#   - the NPM_TOKEN repository secret must exist (it does not yet);
#   - `dry_run` is true by default, so a first run only packs and prints.
# Publishing also needs "private": true removed from packages/ifcsheet/package.json,
# and the decisions in docs/architecture/npm-publishing.md settled first: until
# then the package cannot install from npm.
name: Release npm (manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm'
        required: true
      dry_run:
        description: 'Pack and print only, do not publish'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @bimvoice/ifcsheet
    runs-on: ubuntu-latest
    if: inputs.confirm == 'publish'
    steps:
      - name: Require NPM_TOKEN
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "NPM_TOKEN is not set; nothing was published." >&2
            exit 1
          fi
      - uses: actions/checkout@v7
      - name: Refuse anything outside the publish allowlist
        run: node scripts/check-publish-allowlist.mjs
      - name: Enable pnpm
        run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile --filter "@bimvoice/ifcsheet..."
      - run: pnpm build:wasm:fetch
      - run: pnpm turbo run build --filter="@bimvoice/ifcsheet..."
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          flags="--access public --no-git-checks --provenance"
          if [ "$DRY_RUN" = "true" ]; then flags="$flags --dry-run"; fi
          pnpm --filter @bimvoice/ifcsheet publish $flags

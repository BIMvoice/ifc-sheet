# Checks every pull request gets: typecheck, tests, the gate scripts and, when
# Rust changed, cargo clippy and cargo test (#66).
#
# No secrets are used, so Dependabot and fork pull requests run the same checks.
# Nothing here is continue-on-error: a failing test is a red check.
#
# The gate scripts are compared against the pull request's base commit (see
# scripts/ci-gates-vs-base.mjs): some of them already fail on main, and a pull
# request should fail only for what it adds.
#
# To make these required, add the check names to the `main` ruleset (repository
# setting, not code): Typecheck, Package tests, Viewer tests (shard 0..3),
# Gates vs base, Rust.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:wasm:fetch
      - run: pnpm turbo run build --filter='./packages/*'
      - run: pnpm typecheck

  package-tests:
    name: Package tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:wasm:fetch
      - run: pnpm turbo run build --filter='./packages/*'
      - run: pnpm turbo run test --filter='./packages/*'

  # The viewer suite is about 15k tests, so it is split by test file across
  # four runners (TEST_SHARD / TEST_SHARDS, see apps/viewer/package.json).
  viewer-tests:
    name: Viewer tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      TEST_SHARD: ${{ matrix.shard }}
      TEST_SHARDS: 4
    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:wasm:fetch
      - run: pnpm turbo run build --filter='./packages/*'
      - name: Viewer tests
        working-directory: apps/viewer
        run: pnpm test

  gates:
    name: Gates vs base
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A second checkout of the commit the pull request branched from. The
      # script runs every gate in both trees and fails only on output lines the
      # base did not print.
      - name: Check out the base
        run: git worktree add --detach "$RUNNER_TEMP/base" "${{ github.event.pull_request.base.sha }}"

      - name: Gates, head against base
        run: node scripts/ci-gates-vs-base.mjs "$RUNNER_TEMP/base"

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pushes to main always run; a pull request runs only when it touches
      # Rust, the lockfile or the pinned toolchain.
      - name: Did Rust change?
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA" HEAD | grep -E '^(rust/|Cargo\.(toml|lock)$|rust-toolchain\.toml$)'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
            echo "No Rust changes; skipping."
          fi

      # rust-toolchain.toml pins the nightly; `rustup show` installs it.
      - name: Setup Rust (pinned by rust-toolchain.toml)
        if: steps.changes.outputs.rust == 'true'
        run: rustup show

      - name: Cargo cache
        if: steps.changes.outputs.rust == 'true'
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # On main today the test targets of ifc-lite-processing do not compile:
      # its sources include docs/architecture/evidence/*.json, which is not
      # committed (12 errors). So that crate's test targets are left out of both
      # commands below, and its library and binaries are still linted. Put it
      # back (drop the --exclude, and fold the first clippy step into the
      # second) once those files are committed or the includes are removed.
      - name: cargo clippy (ifc-lite-processing, library and binaries)
        if: steps.changes.outputs.rust == 'true'
        run: cargo clippy -p ifc-lite-processing -- -D warnings

      - name: cargo clippy (everything else, all targets)
        if: steps.changes.outputs.rust == 'true'
        run: cargo clippy --workspace --exclude ifc-lite-processing --all-targets -- -D warnings

      - name: cargo test
        if: steps.changes.outputs.rust == 'true'
        run: cargo test --workspace --exclude ifc-lite-processing

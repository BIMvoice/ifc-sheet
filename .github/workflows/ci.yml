# Checks every pull request gets: typecheck, tests, the gate scripts and, when
# Rust changed, cargo clippy and cargo test (#66).
#
# No secrets are used, so Dependabot and fork pull requests run the same checks.
# Nothing here is continue-on-error: a failing test is a red check.
#
# The gate scripts are compared against the pull request's base commit (see
# scripts/ci-gates-vs-base.mjs): some of them already fail on main, and a pull
# request should fail only for what it adds.
#
# To make these required, add the check names to the `main` ruleset (repository
# setting, not code): Build wasm, Typecheck, Package tests, Viewer tests
# (shard 0..7), Gates vs base, Rust.
#
# Deliberately out of scope for now (follow-up): the other scripts/check-*
# gates (`pnpm lint`: changesets, i18n literals, jsx-a11y; check-refwalk-guards,
# check-api-surface, the docs checks) and the scripts/*.test.mjs files that the
# "Script tests" job leaves out (listed with reasons above that job). Only
# check-module-size, check-test-wiring and check-source-text-assertions are
# compared here.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The merge queue builds a temporary branch per entry; CI must run there too.
  merge_group:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The engine (packages/wasm/pkg) is not committed and IfcSheet's Rust differs
  # from the published @ifc-lite/wasm, so it is built from source once here and
  # handed to the jobs below as an artifact.
  wasm:
    name: Build wasm
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-wasm-build
        with:
          cache-prefix: ci-wasm

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ifc-lite/wasm build

      - name: The build produced the runtime and its types
        run: test -f packages/wasm/pkg/ifc-lite_bg.wasm && test -f packages/wasm/pkg/ifc-lite.d.ts

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: packages/wasm/pkg
          if-no-files-found: error
          retention-days: 3

  typecheck:
    name: Typecheck
    needs: wasm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: packages/wasm/pkg
      - run: pnpm turbo run build --filter='./packages/*'
      - run: pnpm typecheck

  package-tests:
    name: Package tests
    needs: wasm
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: packages/wasm/pkg
      - run: pnpm turbo run build --filter='./packages/*'
      # Two packages at a time: each vitest run already starts a worker per CPU,
      # and turbo's default of ten packages at once on a 4-CPU runner pushed
      # heavy tests past vitest's 5 s limit in whichever package was unlucky
      # (packages/mcp, packages/cache and in-store, on pull requests that did
      # not touch them).
      - run: pnpm turbo run test --filter='./packages/*' --concurrency=2

  # The viewer suite is about 15k tests, so it is split by test file across
  # eight runners (TEST_SHARD / TEST_SHARDS, see apps/viewer/package.json).
  viewer-tests:
    name: Viewer tests (shard ${{ matrix.shard }})
    needs: wasm
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      TEST_SHARD: ${{ matrix.shard }}
      TEST_SHARDS: 8
    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: packages/wasm/pkg
      - run: pnpm turbo run build --filter='./packages/*'
      - name: Viewer tests
        working-directory: apps/viewer
        run: pnpm test

  gates:
    name: Gates vs base
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A second checkout of the commit the pull request branched from. The
      # script runs every gate in both trees and fails only on output lines the
      # base did not print.
      - name: Check out the base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"

      - name: The gate comparison itself
        run: node --test scripts/ci-gates-vs-base.test.mjs

      - name: Gates, head against base
        run: node scripts/ci-gates-vs-base.mjs "$RUNNER_TEMP/base"

  # NOT a required check yet: it is new, and the first red runs may be flakes
  # or environment drift rather than defects. Add "Script tests" to the `main`
  # ruleset once it has been green for a while.
  #
  # One `node --test` line per file, on purpose: scripts/check-test-wiring.mjs
  # reads literal paths from workflow lines that carry `--test`, so a glob or a
  # list kept in another file would leave these tests reported as unwired. A
  # new scripts/**/*.test.mjs is added here by hand (check-test-wiring names it
  # when it is missing). Left out, and why:
  #   - scripts/check-census-timeout, check-ci-aggregate-coverage,
  #     check-ci-path-coverage, check-issue-queue, check-pr-review-signal,
  #     check-review-posted, check-rust-semver, check-server-bin-targets,
  #     lib/ci-verdict-replay, lib/pr-review-signal, lib/server-bin-targets-parse,
  #     release-tag-commit, release-version-changed, scan-dirty-prs,
  #     review/{build-review-input,lane-canary,post-review,rubric-eval,run-judge,
  #     run-reviewer,validate-findings}: assert on workflow files that are not in
  #     this fork (only ci.yml and vercel-deploy.yml exist).
  #   - check-codegen-sync (rustfmt), lib/revert-oracle-browser-observer
  #     (Chrome), lib/revert-oracle-python-wheel (Python venv),
  #     fixtures/upload-fixtures (macOS-only path-guard mismatch, unverified on
  #     Linux): need tooling this job does not install.
  #   - check-changeset-bump: no release anchor in this fork's history.
  #   - check-module-size: apps/viewer/src/components/viewer/PropertiesPanel.tsx
  #     is 2050 lines against a budget of 2048; clearing it means raising a
  #     budget, which needs a maintainer sweep (--all --allow-raise).
  #   - check-unused-locals-baseline: measures 240 against a baseline of 194;
  #     depends on the chore/lint-baselines branch, which removes 74.
  scripts-tests:
    name: Script tests
    needs: wasm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: packages/wasm/pkg
      # Some of the tests import packages/*/dist and the wasm runtime.
      - run: pnpm turbo run build --filter='./packages/*'

      # Every file runs even when an earlier one fails, so one run names all.
      - name: node --test, file by file
        run: |
          fail=0
          node --test scripts/ai-eval/check-ai-eval-invariants.test.mjs || fail=1
          node --test scripts/ai-eval/check-ai-eval-manifest.test.mjs || fail=1
          node --test scripts/ai-eval/lib/invariants.test.mjs || fail=1
          node --test scripts/ai-eval/lib/schema-subset.test.mjs || fail=1
          node --test scripts/ai-eval/lib/sse.test.mjs || fail=1
          node --test scripts/browser-ab-report.test.mjs || fail=1
          node --test scripts/browser-cold-inputs.test.mjs || fail=1
          node --test scripts/browser-cold-teardown.test.mjs || fail=1
          node --test scripts/browser-cold-wrapper.test.mjs || fail=1
          node --test scripts/browser-metadata-readiness.test.mjs || fail=1
          node --test scripts/build-rustdoc-index.test.mjs || fail=1
          node --test scripts/check-agents-md-size.test.mjs || fail=1
          node --test scripts/check-asset-usage.test.mjs || fail=1
          node --test scripts/check-base-freshness.test.mjs || fail=1
          node --test scripts/check-benchmark-regression.test.mjs || fail=1
          node --test scripts/check-clash-degenerate-reason-parity.test.mjs || fail=1
          node --test scripts/check-collab-room-model-target.test.mjs || fail=1
          node --test scripts/check-css-vars.test.mjs || fail=1
          node --test scripts/check-csv-escaper-copies.test.mjs || fail=1
          node --test scripts/check-i18n-literals.test.mjs || fail=1
          node --test scripts/check-icon-button-adoption.test.mjs || fail=1
          node --test scripts/check-isolate-expansion-routing.test.mjs || fail=1
          node --test scripts/check-jsx-a11y.test.mjs || fail=1

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pushes to main always run; a pull request runs only when it touches
      # Rust, the lockfile, the pinned toolchain, .cargo/, the shared wasm
      # build action or this workflow.
      - name: Did Rust change?
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA" HEAD | grep -E '^(rust/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|\.cargo/|\.github/actions/setup-wasm-build/|\.github/workflows/ci\.yml$)'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
            echo "No Rust changes; skipping."
          fi

      # rust-toolchain.toml pins the nightly; `rustup show` installs it.
      - name: Setup Rust (pinned by rust-toolchain.toml)
        if: steps.changes.outputs.rust == 'true'
        run: rustup show

      - name: Cargo cache
        if: steps.changes.outputs.rust == 'true'
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo clippy
        if: steps.changes.outputs.rust == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        if: steps.changes.outputs.rust == 'true'
        run: cargo test --workspace

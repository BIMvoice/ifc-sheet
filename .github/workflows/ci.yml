# License, v. 2.0. If a copy of the MPL was not distributed with this
# file, You can obtain one at https://mozilla.org/MPL/2.0/.

# Checks for pull requests and for main: build wasm, typecheck, package tests,
# viewer tests, the viewer's production build (with its top-level-await chunk
# gate), the gate scripts and, for Rust, cargo clippy and cargo test (#66).
#
# A pull request runs only the jobs its changed files can affect. The `changes`
# job reads `git diff --name-only HEAD^1 HEAD` (HEAD is the merge commit GitHub
# builds for the pull request, so HEAD^1 is the base it was merged onto) and
# sets one flag per job:
#   - docs only (docs/, *.md, mkdocs.yml, requirements-docs.txt, .changeset/,
#     LICENSE*): only the gates run.
#   - Rust only (rust/, apps/server/, Cargo.toml, *.rs, rust-toolchain.toml,
#     .cargo/): wasm, typecheck, package tests and Rust run; the viewer shards
#     do not. Package tests run because every package's turbo hash includes
#     rust/** (turbo.json globalDependencies), so turbo selects them all.
#   - JavaScript: Rust does not run. Package tests run only for the packages
#     the pull request changed and their dependents (turbo
#     `--filter='...[HEAD^1]'`); the viewer shards run unless every change is
#     docs, Rust or an app other than apps/viewer.
#   - a change confined to packages the viewer neither depends on nor mentions
#     (scripts/ci-viewer-affected.mjs decides, and answers "run" on any doubt
#     or error) skips the viewer shards and the viewer production build.
# Anything not listed above counts as JavaScript, so an unclassified path runs
# more, never less. A change under .github/ (this workflow, the shared
# actions), or to pnpm-lock.yaml or Cargo.lock, runs everything. A push to main
# and a merge-queue entry always run everything, with the full package set.
#
# Skipped jobs make the per-job checks unusable as required checks (a skipped
# matrix job reports the unexpanded name "Viewer tests (shard
# ${{ matrix.shard }})"), so the last job, "CI passed", needs every other job
# and fails if any of them failed or was cancelled. Skipped counts as passed.
# The `main` ruleset (repository setting, not code) requires "CI passed" only.
#
# Caches, besides cargo's (Swatinem/rust-cache, written from main only):
#   - the wasm build (packages/wasm/pkg), keyed on a hash of everything the
#     build reads, so a pull request that leaves Rust alone restores it instead
#     of compiling it;
#   - turbo's local cache (.turbo/cache), keyed on pnpm-lock.yaml and the
#     commit, written only by the Typecheck job on a push to main and read by
#     every job that runs turbo. Before it is saved it is cut down to the tasks
#     that run produced, and the @ifc-lite/wasm task is dropped so a turbo hit
#     can never put an older wasm build over this run's artifact. GITHUB_SHA is
#     a build input of apps/viewer only (apps/viewer/turbo.json). As a root
#     `build` input it made every task hash unique per run, so this cache never
#     hit and each job repeated the ~85 s package build.
#
# No secrets are used, so Dependabot and fork pull requests run the same checks.
# Nothing here is continue-on-error: a failing test is a red check.
#
# The gate scripts are compared against the pull request's base commit (see
# scripts/ci-gates-vs-base.mjs): some of them already fail on main, and a pull
# request should fail only for what it adds.
#
# The gates job also runs, directly and not against the base, the checks for
# what review kept finding by hand: test fixtures under apps/*/public/, tests
# that read the wasm build without skipping when it is absent, published
# package changes without a changeset, and changesets naming a non-package.
# Each passes on the tree as it stands (its exceptions are listed, with
# reasons, in scripts/*-allowlist.txt), so a pull request fails only for what
# it adds. Each test file has its own `node --test` step, and each step runs
# even when an earlier one failed, so one red check does not hide the others.
#
# The Lint job runs `pnpm lint` (changesets, test-glob coverage, unused locals,
# i18n literals, jsx-a11y, type scale, and a check that the linter linted
# something) whenever `changes` reports code, that is, on anything but a
# docs-only pull request, and on every push to main.
#
# Deliberately out of scope for now (follow-up): the other scripts/check-*
# gates (check-refwalk-guards, check-api-surface, the docs checks) and the
# scripts/*.test.mjs files that the "Script tests" job leaves out (listed with
# reasons above that job). Only check-module-size, check-test-wiring and
# check-source-text-assertions are compared against the base.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The merge queue builds a temporary branch per entry; CI must run there too.
  merge_group:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decides which of the jobs below a pull request needs; see the header.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      all: ${{ steps.flags.outputs.all }}
      ci: ${{ steps.flags.outputs.ci }}
      code: ${{ steps.flags.outputs.code }}
      docs_only: ${{ steps.flags.outputs.docs_only }}
      packages: ${{ steps.flags.outputs.packages }}
      rust: ${{ steps.flags.outputs.rust }}
      viewer: ${{ steps.flags.outputs.viewer }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge commit and its first parent, the base.
          fetch-depth: 2

      - name: What did this change touch?
        id: flags
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; echo "$1=$2"; }
          everything() {
            echo "$1: running everything."
            out all true; out ci "$2"; out code true; out docs_only false
            out packages true; out rust true; out viewer true
            exit 0
          }

          [ "$EVENT" = "pull_request" ] || everything "Event is $EVENT" false

          changed="$RUNNER_TEMP/changed-files.txt"
          git diff --name-only HEAD^1 HEAD > "$changed"
          echo "Changed files:"; cat "$changed"
          [ -s "$changed" ] || everything "No changed files found" false

          # True when some changed file matches / does not match the pattern.
          # No pipefail on purpose: grep -q may close the pipe early.
          any() { grep -qE "$1" "$changed"; }
          any_but() { grep -vE "$1" "$changed" | grep -q .; }

          DOCS='^(docs/|\.changeset/|mkdocs\.yml$|requirements-docs\.txt$|LICENSE)|\.md$'
          RUST='^(rust/|apps/server/|\.cargo/|rust-toolchain\.toml$)|(^|/)Cargo\.(toml|lock)$|\.rs$'

          if any '^\.github/'; then everything "A change under .github/" true; fi
          if any '^(pnpm-lock\.yaml|Cargo\.lock)$'; then everything "A lockfile changed" false; fi

          out all false
          out ci false
          if any_but "$DOCS"; then out code true; out docs_only false
          else out code false; out docs_only true; fi
          # Rust changes reach every package through the wasm build, and turbo
          # agrees (rust/** is a globalDependency), so they count here.
          if any_but "$DOCS|^apps/"; then out packages true; else out packages false; fi
          if any "$RUST"; then out rust true; else out rust false; fi
          # Files that could reach the viewer: not docs, Rust or an app. They
          # skip the viewer only when scripts/ci-viewer-affected.mjs proves the
          # packages they sit in are neither depended on nor mentioned by it.
          candidates="$RUNNER_TEMP/viewer-candidates.txt"
          grep -vE "$DOCS|$RUST|^apps/" "$changed" > "$candidates" || true
          if any '^apps/viewer/'; then out viewer true
          elif [ ! -s "$candidates" ]; then out viewer false
          else
            verdict=$(node scripts/ci-viewer-affected.mjs "$candidates" || echo true)
            if [ "$verdict" = false ]; then out viewer false; else out viewer true; fi
          fi

  # The engine (packages/wasm/pkg) is not committed and IfcSheet's Rust differs
  # from the published @ifc-lite/wasm, so it is built from source once here and
  # handed to the jobs below as an artifact. The build is cached on a hash of
  # its inputs, so it is compiled only when one of them changed.
  wasm:
    name: Build wasm
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Restore the wasm build
        id: wasm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/wasm/pkg
          key: wasm-pkg-${{ runner.os }}-${{ hashFiles('rust/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/**', 'scripts/build-wasm.sh', 'scripts/run-build-wasm.mjs', 'packages/wasm/package.json', '.github/actions/setup-wasm-build/**') }}

      - if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-wasm-build
        with:
          cache-prefix: ci-wasm

      - name: Enable pnpm
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: corepack enable

      - if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @ifc-lite/wasm build

      - name: The build produced the runtime and its types
        run: test -f packages/wasm/pkg/ifc-lite_bg.wasm && test -f packages/wasm/pkg/ifc-lite.d.ts

      - uses: actions/upload-artifact@v7
        with:
          name: wasm-pkg
          path: packages/wasm/pkg
          if-no-files-found: error
          retention-days: 3

  typecheck:
    name: Typecheck
    needs: [changes, wasm]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Each turbo run writes .turbo/runs/<id>.json, which the cache pruning
      # below reads.
      TURBO_RUN_SUMMARY: 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: wasm-pkg
          path: packages/wasm/pkg

      - name: Restore the turbo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - run: pnpm turbo run build --filter='./packages/*'
      - run: pnpm typecheck

      # Keep only the entries this run's tasks used or wrote, so the cache does
      # not grow with every push, and drop @ifc-lite/wasm (see the header).
      - name: Prune the turbo cache to this run
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          node --input-type=module <<'EOF'
          import { readdirSync, readFileSync, rmSync } from "node:fs";
          const keep = new Set();
          for (const f of readdirSync(".turbo/runs")) {
            const run = JSON.parse(readFileSync(`.turbo/runs/${f}`, "utf8"));
            for (const t of run.tasks) if (t.package !== "@ifc-lite/wasm") keep.add(t.hash);
          }
          let removed = 0;
          for (const f of readdirSync(".turbo/cache")) {
            if (!keep.has(f.split(/[.-]/)[0])) { rmSync(`.turbo/cache/${f}`, { recursive: true }); removed++; }
          }
          console.log(`kept ${keep.size} task hashes, removed ${removed} files`);
          EOF

      - name: Save the turbo cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

  # `pnpm lint`: changesets, test-glob coverage, unused locals, i18n literals,
  # jsx-a11y, type scale, and a check that the linter linted something. It is
  # part of "CI passed" through its `needs`. The unused-locals gate runs tsc in
  # every package, so it needs the same wasm types and built packages as
  # Typecheck.
  lint:
    name: Lint
    needs: [changes, wasm]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: wasm-pkg
          path: packages/wasm/pkg
      - run: pnpm turbo run build --filter='./packages/*'
      - run: pnpm lint

  package-tests:
    name: Package tests
    needs: [changes, wasm]
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ALL: ${{ needs.changes.outputs.all }}
    steps:
      - uses: actions/checkout@v7
        with:
          # turbo's `[HEAD^1]` filter needs the base commit.
          fetch-depth: 2

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: wasm-pkg
          path: packages/wasm/pkg

      - name: Restore the turbo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      # Every package when `changes` says everything runs; otherwise the
      # packages the pull request changed plus their dependents, without apps/
      # and examples/ (the viewer has its own job).
      - name: Which packages
        run: |
          scope="$RUNNER_TEMP/turbo-scope"
          if [ "$ALL" = "true" ]; then
            echo "Every package under packages/."
            printf '%s\n' --filter='./packages/*' > "$scope"
          else
            printf '%s\n' --filter='...[HEAD^1]' --filter='!./apps/*' --filter='!./examples/*' > "$scope"
            echo "Changed packages and their dependents:"
            args=(); while IFS= read -r a; do args+=("$a"); done < "$scope"
            pnpm turbo run test "${args[@]}" --dry=json \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const t=JSON.parse(s).tasks.filter(t=>t.task==="test").map(t=>t.package);console.log(t.length?t.join("\n"):"(none)")})'
          fi

      - name: Build
        run: |
          args=(); while IFS= read -r a; do args+=("$a"); done < "$RUNNER_TEMP/turbo-scope"
          pnpm turbo run build "${args[@]}"
      # Two packages at a time: each vitest run already starts a worker per CPU,
      # and turbo's default of ten packages at once on a 4-CPU runner pushed
      # heavy tests past vitest's 5 s limit in whichever package was unlucky
      # (packages/mcp, packages/cache and in-store, on pull requests that did
      # not touch them).
      - name: Test
        run: |
          args=(); while IFS= read -r a; do args+=("$a"); done < "$RUNNER_TEMP/turbo-scope"
          # One retry, CI only, for the vitest timeouts under runner load. `--retry=1`
          # reaches every package's test script; the node:test packages ignore it
          # (their runner takes no such flag), so only vitest retries. A test that
          # fails twice still fails the job. The default reporter does not print
          # retries; `vitest run --reporter=verbose` marks them "(retry x1)".
          pnpm turbo run test "${args[@]}" --concurrency=2 -- --retry=1

  # The viewer suite is about 15k tests, so it is split by test file across
  # eight runners (TEST_SHARD / TEST_SHARDS, see apps/viewer/package.json).
  viewer-tests:
    name: Viewer tests (shard ${{ matrix.shard }})
    needs: [changes, wasm]
    if: needs.changes.outputs.viewer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      TEST_SHARD: ${{ matrix.shard }}
      TEST_SHARDS: 8
      # Test files already run in separate processes; the runner has 4 CPUs.
      TEST_CONCURRENCY: 2
    steps:
      - uses: actions/checkout@v7

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: wasm-pkg
          path: packages/wasm/pkg

      - name: Restore the turbo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - run: pnpm turbo run build --filter='./packages/*'
      - name: Viewer tests
        working-directory: apps/viewer
        run: pnpm test

  # The production build Vercel deploys, including the check that runs after
  # `vite build` (scripts/check-tla-chunk-await.mjs). Nothing else here bundles
  # the viewer, so a dependency bump that changed the emitted chunks (vite 8.3.4
  # with rolldown 1.2.14, in the npm group update of #187) merged green and
  # failed only in the deploy. Runs whenever the viewer shards do.
  viewer-build:
    name: Viewer production build
    needs: [changes, wasm]
    if: needs.changes.outputs.viewer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The bundle step needs more than Node's default heap; the runner has 16 GB.
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v7

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: wasm-pkg
          path: packages/wasm/pkg

      - name: Restore the turbo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - run: pnpm turbo run build --filter='./packages/*'
      - name: Build the viewer and check its top-level-await chunks
        run: pnpm --filter @ifc-lite/viewer build

  gates:
    name: Gates vs base
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A second checkout of the commit the pull request branched from. The
      # script runs every gate in both trees and fails only on output lines the
      # base did not print.
      - name: Check out the base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"

      - name: The gate comparison itself
        run: node --test scripts/ci-gates-vs-base.test.mjs

      - name: Gates, head against base
        run: node scripts/ci-gates-vs-base.mjs "$RUNNER_TEMP/base"

      - name: The public-fixtures check itself
        if: ${{ !cancelled() }}
        run: node --test scripts/check-public-fixtures.test.mjs

      - name: No test fixtures under apps/*/public
        if: ${{ !cancelled() }}
        run: node scripts/check-public-fixtures.mjs

      - name: The wasm-test-skip check itself
        if: ${{ !cancelled() }}
        run: node --test scripts/check-wasm-test-skip.test.mjs

      - name: Tests that read the wasm build skip without it
        if: ${{ !cancelled() }}
        run: node scripts/check-wasm-test-skip.mjs

      - name: The changeset-required check itself
        if: ${{ !cancelled() }}
        run: node --test scripts/check-changeset-required.test.mjs

      - name: A published package's src/ change carries a changeset
        if: ${{ !cancelled() }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: node scripts/check-changeset-required.mjs --base "$BASE_SHA"

      - name: Changesets name workspace packages
        if: ${{ !cancelled() }}
        run: node scripts/check-changesets.mjs

  # Runs the scripts/*.test.mjs files listed below when `changes` reports code
  # (anything but a docs-only pull request, and every push to main). It is part
  # of "CI passed" through its `needs`, so it gates the merge.
  #
  # One `node --test` line per file, on purpose: scripts/check-test-wiring.mjs
  # reads literal paths from workflow lines that carry `--test`, so a glob or a
  # list kept in another file would leave these tests reported as unwired. A
  # new scripts/**/*.test.mjs is added here by hand (check-test-wiring names it
  # when it is missing). Left out, and why:
  #   - scripts/check-census-timeout, check-ci-aggregate-coverage,
  #     check-ci-path-coverage, check-issue-queue, check-pr-review-signal,
  #     check-review-posted, check-rust-semver, check-server-bin-targets,
  #     lib/ci-verdict-replay, lib/pr-review-signal, lib/server-bin-targets-parse,
  #     release-tag-commit, release-version-changed, scan-dirty-prs,
  #     review/{build-review-input,lane-canary,post-review,rubric-eval,run-judge,
  #     run-reviewer,validate-findings}: assert on workflow files that are not in
  #     this fork (only ci.yml and vercel-deploy.yml exist).
  #   - check-codegen-sync (rustfmt), lib/revert-oracle-browser-observer
  #     (Chrome), lib/revert-oracle-python-wheel (Python venv),
  #     fixtures/upload-fixtures (macOS-only path-guard mismatch, unverified on
  #     Linux): need tooling this job does not install.
  #   - check-changeset-bump: no release anchor in this fork's history.
  scripts-tests:
    name: Script tests
    needs: [changes, wasm]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # check-module-size.test.mjs runs the gate against the real repo, and
          # the gate's merge-base audit needs origin/main and the history.
          fetch-depth: 0

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: wasm-pkg
          path: packages/wasm/pkg
      # Some of the tests import packages/*/dist and the wasm runtime.
      - run: pnpm turbo run build --filter='./packages/*'

      # Every file runs in its own `node --test` process, four at a time, and
      # every file runs even when another fails, so one run names all. `q` only
      # queues a line; the runner below executes the queue and fails when any
      # file failed or when fewer files reported than were queued.
      - name: node --test, file by file
        run: |
          queue="$RUNNER_TEMP/node-tests.txt"; logs="$RUNNER_TEMP/node-test-logs"
          : > "$queue"; mkdir -p "$logs"
          q() { printf '%s\n' "$*" >> "$queue"; }
          q --test scripts/ai-eval/check-ai-eval-invariants.test.mjs
          q --test scripts/ai-eval/check-ai-eval-manifest.test.mjs

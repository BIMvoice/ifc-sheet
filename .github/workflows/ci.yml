# Checks every pull request gets: typecheck, tests, the gate scripts and, when
# Rust changed, cargo clippy and cargo test (#66).
#
# No secrets are used, so Dependabot and fork pull requests run the same checks.
# Nothing here is continue-on-error: a failing test is a red check.
#
# The gate scripts are compared against the pull request's base commit (see
# scripts/ci-gates-vs-base.mjs): some of them already fail on main, and a pull
# request should fail only for what it adds.
#
# To make these required, add the check names to the `main` ruleset (repository
# setting, not code): Build wasm, Typecheck, Package tests, Viewer tests
# (shard 0..7), Gates vs base, Rust.
#
# The gates job also runs, directly and not against the base, the checks for
# what review kept finding by hand: test fixtures under apps/*/public/, tests
# that read the wasm build without skipping when it is absent, published
# package changes without a changeset, and changesets naming a non-package.
# Each passes on the tree as it stands (its exceptions are listed, with
# reasons, in scripts/*-allowlist.txt), so a pull request fails only for what
# it adds. Each test file has its own `node --test` step, and each step runs
# even when an earlier one failed, so one red check does not hide the others.
#
# Deliberately out of scope for now (follow-up): the other scripts/check-*
# gates (`pnpm lint`: i18n literals, jsx-a11y; check-refwalk-guards,
# check-api-surface, the docs checks) and their scripts/*.test.mjs files. Only
# check-module-size, check-test-wiring and check-source-text-assertions are
# compared against the base.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The merge queue builds a temporary branch per entry; CI must run there too.
  merge_group:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The engine (packages/wasm/pkg) is not committed and IfcSheet's Rust differs
  # from the published @ifc-lite/wasm, so it is built from source once here and
  # handed to the jobs below as an artifact.
  wasm:
    name: Build wasm
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-wasm-build
        with:
          cache-prefix: ci-wasm

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ifc-lite/wasm build

      - name: The build produced the runtime and its types
        run: test -f packages/wasm/pkg/ifc-lite_bg.wasm && test -f packages/wasm/pkg/ifc-lite.d.ts

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: packages/wasm/pkg
          retention-days: 3

  typecheck:
    name: Typecheck
    needs: wasm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: packages/wasm/pkg
      - run: pnpm turbo run build --filter='./packages/*'
      - run: pnpm typecheck

  package-tests:
    name: Package tests
    needs: wasm
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: packages/wasm/pkg
      - run: pnpm turbo run build --filter='./packages/*'
      # Two packages at a time: each vitest run already starts a worker per CPU,
      # and turbo's default of ten packages at once on a 4-CPU runner pushed
      # heavy tests past vitest's 5 s limit in whichever package was unlucky
      # (packages/mcp, packages/cache and in-store, on pull requests that did
      # not touch them).
      # One retry, CI only, for the vitest timeouts under runner load. `--retry=1`
      # reaches every package's test script; the node:test packages ignore it
      # (their runner takes no such flag), so only vitest retries. A test that
      # fails twice still fails the job. The default reporter does not print
      # retries; `vitest run --reporter=verbose` marks them "(retry x1)".
      - run: pnpm turbo run test --filter='./packages/*' --concurrency=2 -- --retry=1

  # The viewer suite is about 15k tests, so it is split by test file across
  # eight runners (TEST_SHARD / TEST_SHARDS, see apps/viewer/package.json).
  viewer-tests:
    name: Viewer tests (shard ${{ matrix.shard }})
    needs: wasm
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      TEST_SHARD: ${{ matrix.shard }}
      TEST_SHARDS: 8
    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: packages/wasm/pkg
      - run: pnpm turbo run build --filter='./packages/*'
      - name: Viewer tests
        working-directory: apps/viewer
        run: pnpm test

  gates:
    name: Gates vs base
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A second checkout of the commit the pull request branched from. The
      # script runs every gate in both trees and fails only on output lines the
      # base did not print.
      - name: Check out the base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"

      - name: The gate comparison itself
        run: node --test scripts/ci-gates-vs-base.test.mjs

      - name: Gates, head against base
        run: node scripts/ci-gates-vs-base.mjs "$RUNNER_TEMP/base"

      - name: The public-fixtures check itself
        if: ${{ !cancelled() }}
        run: node --test scripts/check-public-fixtures.test.mjs

      - name: No test fixtures under apps/*/public
        if: ${{ !cancelled() }}
        run: node scripts/check-public-fixtures.mjs

      - name: The wasm-test-skip check itself
        if: ${{ !cancelled() }}
        run: node --test scripts/check-wasm-test-skip.test.mjs

      - name: Tests that read the wasm build skip without it
        if: ${{ !cancelled() }}
        run: node scripts/check-wasm-test-skip.mjs

      - name: The changeset-required check itself
        if: ${{ !cancelled() }}
        run: node --test scripts/check-changeset-required.test.mjs

      - name: A published package's src/ change carries a changeset
        if: ${{ !cancelled() }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: node scripts/check-changeset-required.mjs --base "$BASE_SHA"

      - name: Changesets name workspace packages
        if: ${{ !cancelled() }}
        run: node scripts/check-changesets.mjs

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pushes to main always run; a pull request runs only when it touches
      # Rust, the lockfile, the pinned toolchain, .cargo/, the shared wasm
      # build action or this workflow.
      - name: Did Rust change?
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA" HEAD | grep -E '^(rust/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|\.cargo/|\.github/actions/setup-wasm-build/|\.github/workflows/ci\.yml$)'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
            echo "No Rust changes; skipping."
          fi

      # rust-toolchain.toml pins the nightly; `rustup show` installs it.
      - name: Setup Rust (pinned by rust-toolchain.toml)
        if: steps.changes.outputs.rust == 'true'
        run: rustup show

      - name: Cargo cache
        if: steps.changes.outputs.rust == 'true'
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo clippy
        if: steps.changes.outputs.rust == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        if: steps.changes.outputs.rust == 'true'
        run: cargo test --workspace

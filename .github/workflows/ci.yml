          run_one() {
            log="$LOGS/$(printf '%s' "$1" | tr -c 'A-Za-z0-9.-' '_').log"
            if node $1 > "$log" 2>&1; then echo "ok   $1"; else echo "FAIL $1"; touch "$log.failed"; fi
          }
          export -f run_one; export LOGS="$logs"
          tr '\n' '\0' < "$queue" | xargs -0 -P 4 -n 1 bash -c 'run_one "$1"' _ || true

          fail=0
          for f in "$logs"/*.log.failed; do
            [ -e "$f" ] || break
            echo "::group::output of ${f%.failed}"; cat "${f%.failed}"; echo "::endgroup::"; fail=1
          done
          queued=$(wc -l < "$queue"); reported=$(find "$logs" -name '*.log' | wc -l)
          if [ "$queued" -ne "$reported" ]; then
            echo "::error::$queued test files queued, $reported reported"; fail=1
          fi
          echo "$queued test files, $(find "$logs" -name '*.failed' | wc -l) failed"
          exit $fail

  # Runs when `changes` says Rust changed: always on main and in the merge
  # queue, and on a pull request that touches Rust, Cargo.lock, the pinned
  # toolchain, .cargo/ or anything under .github/.
  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml pins the nightly; `rustup show` installs it.
      - name: Setup Rust (pinned by rust-toolchain.toml)
        run: rustup show

      - name: Cargo cache
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  # The one check the `main` ruleset requires. Skipped jobs pass; a failed or
  # cancelled one fails this job.
  ci-passed:
    name: CI passed
    if: always()
    needs: [changes, wasm, typecheck, lint, package-tests, viewer-tests, viewer-build, gates, scripts-tests, rust]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")')
          if [ -n "$bad" ]; then
            echo "::error::Not passed: $bad"
            exit 1
          fi

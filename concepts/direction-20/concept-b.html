<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IfcSheet concept B: The Proof</title>
<style>
*{box-sizing:border-box}
:root{--navy:#071B3B;--deep:#0751B9;--blue:#087DFA;--cyan:#2CCEF0;--light:#F4F8FC;--sys:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
html,body{margin:0;height:100%;overflow:hidden;font-family:var(--sys);-webkit-font-smoothing:antialiased}
#story{position:fixed;left:0;right:0;bottom:0;height:64px;background:#fff;border-top:1px solid #d9e3f0;display:flex;align-items:center;gap:28px;padding:0 28px;color:var(--navy);z-index:100}
#story .sg-tag{font-size:11px;letter-spacing:.14em;font-weight:700;color:var(--deep);white-space:nowrap;text-transform:uppercase;border:1px solid #cfe0f7;background:var(--light);padding:6px 10px;border-radius:3px}
#story .sg-txt{flex:1;min-width:0;line-height:1.35}
#story .sg-txt b{font-size:14px;margin-right:10px}
#story .sg-txt span{font-size:13.5px;color:#4b5f7d}
#story .sg-nav{display:flex;align-items:center;gap:12px}
#story .sg-nav button{width:36px;height:36px;border:1px solid #cdd9ea;background:#fff;border-radius:50%;font-size:16px;color:var(--navy);cursor:pointer}
#story .sg-nav button:hover{background:var(--light)}
#story .sg-dots{display:flex;gap:7px;align-items:center}
#story .sg-dots i{width:8px;height:8px;border-radius:50%;background:#cdd9ea;display:block;cursor:pointer}
#story .sg-dots i.on{background:var(--blue);width:22px;border-radius:5px}
#story .sg-n{font-size:12px;color:#6b7e9a;min-width:30px;text-align:center}
.stamp{line-height:1.2}

body{background:#EAF0F8;color:var(--navy)}
#app{position:relative;height:calc(100vh - 64px);overflow:hidden}
.scr{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .5s}
.scr.on{opacity:1;pointer-events:auto}
.brand{position:absolute;left:36px;top:24px;display:flex;align-items:center;gap:12px;font-weight:600;font-size:16px;z-index:3}
.brand small{font-weight:400;color:#5b7191;font-size:14px;margin-left:6px;padding-left:16px;border-left:1px solid #c5d4e8}
.btn{display:inline-flex;align-items:center;gap:12px;background:var(--navy);color:#fff;border:0;font-size:18px;padding:17px 28px;border-radius:6px;cursor:pointer;font-family:inherit;transition:.2s}
.btn:hover{background:var(--blue)}
.btn.ghost{background:transparent;color:var(--deep);padding:17px 8px}
.btn.ghost:hover{background:transparent;text-decoration:underline}
kbd{font-family:var(--sys);font-size:12px;border:1px solid rgba(255,255,255,.4);border-radius:4px;padding:2px 7px;margin-left:6px;opacity:.85}
.btn.ghost kbd{border-color:#a9c0de;color:#5b7191}
/* register */
#reg .card{position:absolute;left:50%;top:68px;transform:translateX(-50%);width:1020px;background:#fff;box-shadow:0 40px 80px -40px rgba(7,27,59,.35),0 0 0 1px rgba(7,27,59,.07);padding:34px 60px 30px}
#reg .k{font-size:12.5px;letter-spacing:.22em;color:var(--deep);font-weight:600;text-transform:uppercase}
#reg h1{font-weight:300;font-size:44px;letter-spacing:-.02em;margin:10px 0 4px}
#reg .sub{font-size:16px;color:#5b7191}
#reg table{width:100%;border-collapse:collapse;margin-top:22px}
#reg th{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:#7d8fa9;font-weight:600;text-align:left;padding:0 0 12px;border-bottom:2px solid var(--navy)}
#reg td{padding:9px 0;border-bottom:1px solid #dbe5f1;vertical-align:middle;font-size:16px}
#reg tr.row{opacity:0;transform:translateY(10px);transition:.5s}
#reg .on tr.row{opacity:1;transform:none}
#reg td.th{width:150px;padding-right:24px}
#reg td.th div{width:126px;border:1px solid #cdd9ea;line-height:0;background:#fff}
#reg td.th svg{width:100%;height:auto}
#reg td.no{font-weight:700;font-size:20px;width:120px;letter-spacing:.01em}
#reg td.ti b{font-size:20px;font-weight:600;display:block;margin-bottom:3px}
#reg td.ti span{color:#5b7191;font-size:14.5px}
#reg td.vi,#reg td.sc,#reg td.sz{color:#2b4165;width:110px}
#reg .foot{display:flex;align-items:center;justify-content:space-between;margin-top:20px}
#reg .foot p{margin:0;font-size:15px;color:#5b7191;max-width:360px;line-height:1.5}
/* review */
#rev .gut{position:absolute;left:32px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:26px;align-items:center}
.gut .d{width:34px;height:34px;border-radius:50%;border:1.5px solid #a9c0de;background:#fff;font-size:14px;font-weight:600;color:#5b7191;display:flex;align-items:center;justify-content:center;position:relative}
.gut .d.cur{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 0 0 6px rgba(7,27,59,.1)}
.gut .d.kept{background:var(--blue);border-color:var(--blue);color:#fff}
.gut .d.rm{background:#fff;color:#8394ad;border-style:dashed;text-decoration:line-through}
.gut:before{content:"";position:absolute;left:50%;top:17px;bottom:17px;width:1px;background:#bccce2;z-index:0}
.gut .d{z-index:1}
#sheetw{position:absolute;left:104px;top:50%;transform:translateY(-50%)}
#sheetbox{width:830px;height:587px;background:#fff;box-shadow:0 40px 70px -34px rgba(7,27,59,.45),0 0 0 1px rgba(7,27,59,.09);position:relative}
#sheetbox svg.sheet-svg{width:830px;height:587px;display:block}
.stamp{position:absolute;right:60px;top:30px;border:4px double var(--deep);color:var(--deep);font-weight:800;letter-spacing:.24em;font-size:26px;padding:8px 18px 8px 24px;transform:rotate(-9deg) scale(1.4);opacity:0;mix-blend-mode:multiply;transition:.3s;pointer-events:none;border-radius:4px}
.stamp.on{opacity:.88;transform:rotate(-9deg) scale(1)}
.stamp.rm{color:#5a6a85;border-color:#5a6a85;border-style:dashed}
#notes{position:absolute;left:974px;top:56px;bottom:40px;width:410px;display:flex;flex-direction:column}
#notes .k{font-size:12.5px;letter-spacing:.2em;color:var(--deep);font-weight:600;text-transform:uppercase}
#notes h2{font-weight:300;font-size:44px;letter-spacing:-.02em;margin:10px 0 14px;line-height:1.05}
#notes h2 b{font-weight:700;font-size:20px;letter-spacing:.02em;display:block;margin-bottom:6px;color:#2b4165}
#notes p.why{font-size:16px;line-height:1.55;color:#3f5578;margin:0 0 26px}
#notes p.why em{font-style:normal;font-weight:600;color:var(--navy);border-bottom:2px solid var(--cyan)}
.dec{border-top:1px solid #cdd9ea;padding:18px 0 20px}
.dec .l{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#6b7e9a;margin-bottom:12px;display:flex;justify-content:space-between}
.dec .l span{letter-spacing:0;text-transform:none;font-size:14px;color:var(--navy);font-weight:600}
.chips{display:flex;gap:8px}
.chips button{flex:1;background:#fff;border:1.5px solid #bccce2;color:var(--navy);font-size:17px;padding:12px 0;border-radius:6px;cursor:pointer;font-family:inherit;transition:.15s}
.chips button:hover{border-color:var(--blue)}
.chips button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chips button[disabled]{opacity:.38;cursor:not-allowed;border-style:dashed}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:linear-gradient(90deg,#bccce2 0%,#bccce2 100%);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--blue);margin-top:-11px;box-shadow:0 0 0 6px rgba(8,125,250,.18)}
.rl{display:flex;justify-content:space-between;font-size:12.5px;color:#6b7e9a;margin-top:2px}
.acts{margin-top:auto;display:flex;align-items:center;gap:14px;padding-top:20px;border-top:1px solid #cdd9ea}
.acts .btn{flex:1;justify-content:center;white-space:nowrap;font-size:17px;padding:16px 18px}
.acts .sec{background:#fff;color:var(--navy);border:1.5px solid #bccce2;flex:0 0 auto;padding:16px 22px}
.acts .sec:hover{border-color:var(--navy);background:#fff;color:var(--navy)}
.acts .sec kbd{border-color:#a9c0de;color:#5b7191}
.alt{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.alt .o{background:#fff;border:1.5px solid #bccce2;border-radius:5px;cursor:pointer;padding:6px 6px 8px;transition:.15s;text-align:center;font-size:12.5px;color:#3f5578}
.alt .o:hover{border-color:var(--blue)}
.alt .o.on{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy);color:var(--navy);font-weight:600}
.alt .o svg{display:block;width:100%;height:70px;margin-bottom:6px}
.cur-t{font-size:13px;color:var(--deep);font-weight:600}
/* final */
#fin .wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:1180px}
#fin .k{font-size:12.5px;letter-spacing:.22em;color:var(--deep);font-weight:600;text-transform:uppercase}
#fin h1{font-weight:300;font-size:58px;letter-spacing:-.025em;margin:12px 0 10px}
#fin .lead{font-size:19px;color:#3f5578;max-width:760px;line-height:1.5;margin:0}
#fin .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;margin-top:40px}
#fin .t{position:relative}
#fin .t .p{background:#fff;box-shadow:0 24px 44px -26px rgba(7,27,59,.5),0 0 0 1px rgba(7,27,59,.09);line-height:0;position:relative;cursor:pointer;transition:.2s}
#fin .t .p:hover{transform:translateY(-4px)}
#fin .t svg.sheet-svg{width:100%;height:auto}
#fin .t .stamp{right:14px;top:14px;font-size:14px;border-width:3px;padding:4px 10px 4px 14px;transform:rotate(-9deg)}
#fin .t.rm .p{opacity:.45;filter:grayscale(1)}
#fin .t b{display:block;margin-top:16px;font-size:18px}
#fin .t span{display:block;font-size:14px;color:#5b7191;margin-top:3px;line-height:1.45}
#fin .go{display:flex;align-items:center;gap:20px;margin-top:44px}
</style></head><body>
<div id="app">
 <div class="brand"><span id="logo"></span>IfcSheet<small>Sample House</small></div>

 <section class="scr" id="reg"><div class="card" id="regcard">
   <div class="k">Drawing register</div><h1>Sample House</h1><div class="sub">Draft set P1 &nbsp;&middot;&nbsp; made from the model on 13 October 2026 &nbsp;&middot;&nbsp; A. Architect</div>
   <table><thead><tr><th></th><th>No.</th><th>Sheet</th><th>Views</th><th>Scale</th><th>Size</th></tr></thead><tbody id="regbody"></tbody></table>
   <div class="foot"><p>Drawn from 2 storeys, 10.0 x 7.0 m. Scales were chosen to fit the sheet. Nothing here is final.</p><div><button class="btn ghost" id="asis">Issue as it is</button><button class="btn" id="start">Check it, sheet by sheet <kbd>Enter</kbd></button></div></div>
 </div></section>

 <section class="scr" id="rev">
  <div class="gut" id="gut"></div>
  <div id="sheetw"><div id="sheetbox"><div id="sheetsvg"></div><div class="stamp" id="stamp">KEPT</div></div></div>
  <div id="notes"></div>
 </section>

 <section class="scr" id="fin"><div class="wrap">
  <div class="k">Review finished</div><h1>The set is checked.</h1><p class="lead" id="finlead"></p>
  <div class="grid" id="fingrid"></div>
  <div class="go"><button class="btn">Issue the set as PDF</button><button class="btn ghost" id="reopen">Reopen any sheet</button></div>
 </div></section>
</div>
<script>

 else{s+=ln(a,y,a,y+t,W.t,d,c)+ln(b,y,b,y+t,W.t,d,c);
  if(!o.hi&&o.leaf!==false){var dir=o.dir||-1,len=b-a,ye=dir>0?y+t:y,hx=o.hinge==='b'?b:a,ot=o.hinge==='b'?a:b,sw=o.hinge==='b'?(dir>0?1:0):(dir>0?0:1);

function dimH(xs,y,d,len,k,rep){var W=Wt(k),m=function(v){return v/k},s=ln(xs[0],y,xs[xs.length-1],y,W.t);

 for(var i=0;i<xs.length-1;i++)s+=tx((xs[i]+xs[i+1])/2,y-d*m(1),String(rep?rep[i]:Math.round((xs[i+1]-xs[i])*10)),m(2),{});return s}

 ys.forEach(function(y){s+=ln(x-m(1.1),y+m(1.1),x+m(1.1),y-m(1.1),W.m)+ln(x-d*m(1.4),y,x+d*len,y,W.f)});

 var wg=function(l){return noWin?[]:l},dg=function(l){return hi?[]:l};

 if(hi)So=[];

  fl+=rc(614,32,354,58,'none',W.f)+rc(670,42,56,38,'none',W.f)+ci(698,61,m(1.4),'none',W.f)+rc(836,40,64,42,'none',W.f)+[852,884].map(function(x){return ci(x,52,m(1.6),'none',W.f)+ci(x,72,m(1.6),'none',W.f)}).join('')+rc(680,140,180,52,'none',W.f);
  fl+=rc(420,474,34,24,'none',W.f)+'<ellipse cx="437" cy="520" rx="14" ry="19" fill="none" stroke="'+INK+'" stroke-width="'+W.f+'"/>'+rc(540,470,44,32,'none',W.f);
 }else{

  fl+=rc(900,34,66,170,'none',W.f)+rc(912,44,42,100,'none',W.f)+rc(640,34,50,38,'none',W.f)+rc(730,34,36,26,'none',W.f);
  fl+=rc(40,430,170,60,'none',W.f)+rc(100,500,40,40,'none',W.f)+rc(430,360,160,26,'none',W.f);
 }
 if(!o.simple)s+=fl;
 /* stair */
 s+=rc(760,262,100,392,lv===0?'#fff':'none',W.m);
 var cnt=lv===0?14:9;
 for(var i=1;i<=cnt;i++)s+=ln(760,654-i*28,860,654-i*28,W.f);
 if(lv===0){s+=ln(810,640,810,290,W.t)+'<polygon points="810,270 800,296 820,296" fill="'+INK+'"/>'+ci(810,642,m(1),INK)+tx(880,300,'UP',m(2),{c:GR})}

var IDS=['A-101','A-201','A-202','A-301'];
var NAME={'A-101':['Floor plans','Ground and first floor'],'A-201':['Elevations','South and north'],'A-202':['Elevations','East and west'],'A-301':['Sections','Section A and section B']};
var m={planK:.2,cut:1.2,swap:'N',status:{'A-101':null,'A-201':null,'A-202':null,'A-301':null},touched:{}};
var $=function(i){return document.getElementById(i)};
function scr(id){['reg','rev','fin'].forEach(function(s){$(s).classList[s===id?'add':'remove']('on')})}
function sheetsNow(){var S=L.mkSheets({planK:m.planK,cut:m.cut});S['A-201']=swapSheet();return S}
function altView(c){if(c==='N')return{id:'eN',kind:'elev',face:'N',k:.2,no:'2',label:'NORTH ELEVATION'};if(c==='E')return{id:'eN',kind:'elev',face:'E',k:.2,no:'2',label:'EAST ELEVATION'};if(c==='W')return{id:'eN',kind:'elev',face:'W',k:.2,no:'2',label:'WEST ELEVATION'};
 return{id:'eN',kind:'sect',x:c==='SA'?810:240,k:.2,no:'2',label:c==='SA'?'SECTION A':'SECTION B'}}
function swapSheet(){var v=altView(m.swap);v.cell=[15,196,502,182];if(v.kind==='sect'){v.cell=[15,196,502,182]}
 return L.sheet({no:'A-201',title:'Elevations',sub:m.swap==='N'?'South and north':'South and '+altView(m.swap).label.split(' ')[0].toLowerCase(),views:[{id:'eS',kind:'elev',face:'S',k:.2,no:'1',label:'SOUTH ELEVATION',cell:[15,14,502,182]},v]})}
/* register */
function buildReg(){var S=L.mkSheets(),h='';IDS.forEach(function(id,i){h+='<tr class="row" style="transition-delay:'+(.25+i*.18)+'s"><td class="th"><div>'+S[id]+'</div></td><td class="no">'+id+'</td><td class="ti"><b>'+NAME[id][0]+'</b><span>'+NAME[id][1]+'</span></td><td class="vi">2 views</td><td class="sc">'+(id==='A-101'||id==='A-201'||id==='A-202'||id==='A-301'?'1 : 50':'')+'</td><td class="sz">A2</td></tr>'});$('regbody').innerHTML=h}
/* gutter */
function gut(cur){var h='';IDS.forEach(function(id,i){var st=m.status[id];h+='<div class="d '+(i===cur?'cur ':'')+(st==='kept'?'kept ':'')+(st==='rm'?'rm':'')+'" title="'+id+'">'+(st==='kept'?'✓':(i+1))+'</div>'});$('gut').innerHTML=h}
function stamp(kind){var s=$('stamp');s.className='stamp'+(kind==='rm'?' rm':'');s.textContent=kind==='rm'?'REMOVED':'KEPT';if(kind){void s.offsetWidth;s.classList.add('on')}}
function showSheet(id){$('sheetsvg').innerHTML=sheetsNow()[id];var st=m.status[id];stamp(st)}
function decide(id,kind){m.status[id]=kind;stamp(kind);setTimeout(function(){Story.go(Story.cur()+1)},650)}
/* notes: sheet 1 */
function notes1(){var f=function(k){return L.mkSheets};
 $('notes').innerHTML='<div class="k">Sheet 1 of 4</div><h2><b>A-101</b>Floor plans</h2>'+
 '<p class="why">Ground and first floor, side by side. <em>1 : 50</em> is the largest scale at which both plans fit on an A2 sheet. The section marks A and B are already placed.</p>'+
 '<div class="dec"><div class="l">Scale of the plans<span id="sclab">1 : 50</span></div><div class="chips" id="chips"><button data-k=".1" disabled title="Does not fit A2">1 : 20</button><button data-k=".2">1 : 50</button><button data-k=".1">1 : 100</button><button data-k=".05">1 : 200</button></div></div>'+
 '<div class="dec"><div class="l">Where the plans are cut<span id="cutlab">1.20 m above the floor</span></div><input type="range" id="cutr" min="30" max="280" step="5" value="120"><div class="rl"><span>below the sills</span><span>through the windows</span><span>above the doors</span></div></div>'+
 '<div class="acts"><button class="btn" id="keep">Keep this sheet <kbd>Enter</kbd></button><button class="btn sec" id="rmv">Remove <kbd>Del</kbd></button></div>';
 var ch=$('chips').children;function mark(){[].forEach.call(ch,function(b,i){if(i===0)return;b.classList[+b.dataset.k===m.planK?'add':'remove']('on')});$('sclab').textContent='1 : '+Math.round(10/m.planK)}
 [].forEach.call(ch,function(b,i){if(i)b.onclick=function(){m.planK=+b.dataset.k;mark();showSheet('A-101')}});mark();
 $('cutr').value=Math.round(m.cut*100);$('cutr').oninput=function(){m.cut=this.value/100;$('cutlab').textContent=m.cut.toFixed(2)+' m above the floor';showSheet('A-101')};
 $('cutlab').textContent=m.cut.toFixed(2)+' m above the floor';
 $('keep').onclick=function(){decide('A-101','kept')};$('rmv').onclick=function(){decide('A-101','rm')}}
/* notes: sheet 2 */
var OPTS=[['N','North'],['E','East'],['W','West'],['SA','Section A'],['SB','Section B']];
function notes2(){var h='<div class="k">Sheet 2 of 4</div><h2><b>A-201</b>Elevations</h2><p class="why">Two elevations stacked, both at <em>1 : 50</em>. The south front is fixed. Pick what else hangs below it.</p><div class="dec"><div class="l">Bottom view<span class="cur-t" id="curt"></span></div><div class="alt" id="alt">';
 OPTS.forEach(function(o){var c=altView(o[0]);var body=c.kind==='elev'?L.elev(c.face,.1):L.sect(.1,{x:c.x});var vb=c.kind==='elev'?'-30 -20 '+((c.face==='N'||c.face==='S')?1060:760)+' 660':'-60 -20 860 760';
  h+='<div class="o'+(m.swap===o[0]?' on':'')+'" data-o="'+o[0]+'"><svg viewBox="'+vb+'" preserveAspectRatio="xMidYMid meet">'+body+'</svg>'+o[1]+'</div>'});
 h+='<div class="o" style="border-style:dashed;display:flex;align-items:center;justify-content:center;color:#6b7e9a">More from the model…</div></div></div><div class="acts"><button class="btn" id="keep">Keep this sheet <kbd>Enter</kbd></button><button class="btn sec" id="rmv">Remove <kbd>Del</kbd></button></div>';
 $('notes').innerHTML=h;var lab=function(){var o=OPTS.filter(function(o){return o[0]===m.swap})[0];$('curt').textContent=o[1]+(m.swap==='N'?' (as drawn)':'')};lab();
 [].forEach.call($('alt').querySelectorAll('.o[data-o]'),function(el){el.onclick=function(){m.swap=el.dataset.o;m.touched.swap=1;[].forEach.call($('alt').querySelectorAll('.o'),function(x){x.classList.remove('on')});el.classList.add('on');lab();showSheet('A-201')}});
 $('keep').onclick=function(){decide('A-201','kept')};$('rmv').onclick=function(){decide('A-201','rm')}}
/* final */
function fin(){m.status['A-202']=m.status['A-202']||'rm';m.status['A-301']=m.status['A-301']||'kept';if(!m.status['A-101'])m.status['A-101']='kept';if(!m.status['A-201'])m.status['A-201']='kept';
 var S=sheetsNow(),h='',kept=0,views=0;
 var note={'A-101':(m.planK!==.2?'Plans changed to 1 : '+Math.round(10/m.planK)+'. ':'Kept as drawn. ')+(m.cut!==1.2?'Cut raised to '+m.cut.toFixed(2)+' m.':''),'A-201':m.swap!=='N'?'North elevation swapped for '+OPTS.filter(function(o){return o[0]===m.swap})[0][1].toLowerCase()+'.':'Kept as drawn.','A-202':'Removed: the east and west fronts go on another sheet later.','A-301':'Kept as drawn.'};
 IDS.forEach(function(id){var st=m.status[id];if(st==='kept'){kept++;views+=2}
  h+='<div class="t'+(st==='rm'?' rm':'')+'"><div class="p" data-id="'+id+'">'+S[id]+'<div class="stamp on'+(st==='rm'?' rm':'')+'">'+(st==='rm'?'REMOVED':'KEPT')+'</div></div><b>'+id+' '+NAME[id][0]+'</b><span>'+note[id]+'</span></div>'});
 $('fingrid').innerHTML=h;$('finlead').textContent=kept+' sheets and '+views+' views go out. Everything you did not touch stays exactly as it was drawn, and each change is listed under its sheet.'}
$('start').onclick=function(){Story.go(1)};$('asis').onclick=function(){Story.go(3)};
$('reopen').onclick=function(){Story.go(1)};
document.addEventListener('keydown',function(e){if(e.target&&e.target.tagName==='INPUT'&&e.key!=='Enter')return;var c=Story.cur();
 if(e.key==='Enter'){if(c===0)Story.go(1);else if(c===1)$('keep').click();else if(c===2)$('keep').click()}
 if((e.key==='Delete'||e.key==='Backspace')&&(c===1||c===2))$('rmv').click()});
buildReg();
Story.init({tag:'B · The Proof',states:[
 {title:'The model opens: a register of the draft set.',cap:'The set arrives as a printed drawing register you already know how to read: number, title, views, scale, size.',enter:function(){scr('reg');$('regcard').classList.remove('on');setTimeout(function(){$('regcard').classList.add('on')},120)}},
 {title:'Check it like a proof, one sheet at a time.',cap:'Each sheet comes up large with the reason it looks this way. Change the scale or the cut, then keep or remove it with one key.',enter:function(){scr('rev');gut(0);notes1();showSheet('A-101')}},
 {title:'Swap what hangs on a sheet.',cap:'Sheet 2: the lower view is replaced by choosing from what the model can show, as small pictures rather than a list of names.',enter:function(){scr('rev');gut(1);notes2();showSheet('A-201')}},
 {title:'Done: every change is listed under its sheet.',cap:'Sheets 3 and 4 went the same way. What you did not touch is untouched; what you changed is written next to it.',enter:function(){fin();scr('fin')}}
]});
</script></body></html>
